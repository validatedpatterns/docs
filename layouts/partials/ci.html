<script type="text/javascript" src="/js/dashboard.v2.js"></script>
<div class='results'>
  <div id="ci-dataset">
    {{ partial "spinner.html" . }}
  </div>
  <script>
    obtainBadges({
      'target': 'ci-dataset',
      'filter_field': 'pattern',
      'filter_value': '{{ .Params.ci }}',
      'disable_buttons': true,
      'ci_sources': {{ .Params.ci_sources | default (slice) | jsonify | safeJS }}
    });
  </script>
</div>
